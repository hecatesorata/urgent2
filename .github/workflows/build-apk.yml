name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repo
        uses: actions/checkout@v4

      - name: Setup Java (dibutuhkan Android build)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js (dibutuhkan Cordova CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Terima semua lisensi Android SDK (robust)
        run: |
          set -e
          echo "Mencari sdkmanager di PATH or common ANDROID_HOME/ANDROID_SDK_ROOT locations..."
          if command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager found on PATH"
            yes | sdkmanager --licenses
          elif [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "sdkmanager found at \$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses
          elif [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "sdkmanager found at \$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses
          else
            echo "::error::sdkmanager not found. Listing contents of possible SDK dirs for debugging:"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<not-set>}"
            echo "ANDROID_HOME=${ANDROID_HOME:-<not-set>}"
            ls -la "${ANDROID_SDK_ROOT:-/opt/hostedtoolcache}" 2>/dev/null || true
            ls -la "${ANDROID_HOME:-/opt/hostedtoolcache}" 2>/dev/null || true
            echo "::error::Cannot accept Android SDK licenses because sdkmanager is missing."
            exit 1
          fi

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Install dependency project Node.js (yang dibundel ke dalam APK)
        working-directory: nodejs-assets/nodejs-project
        run: npm install --omit=dev

      - name: Tambah platform Android
        run: cordova platform add android

      - name: Tambah plugin nodejs-mobile-cordova
        run: cordova plugin add nodejs-mobile-cordova

      - name: Build APK (debug, sudah bisa langsung diinstall)
        run: cordova build android --verbose

      - name: Cari lokasi file APK
        id: find_apk
        run: |
          set -e
          echo "Mencari file .apk di platforms/android ..."
          APK_PATH=$(find platforms/android -type f -name "*.apk" | sort | head -n 1 || true)

          # also check the modern path for cordova-android (app/...)
          if [ -z "$APK_PATH" ]; then
            echo "Tidak ditemukan di pencarian pertama, cek app build outputs..."
            APK_PATH=$(find platforms/android/app/build/outputs -type f -name "*.apk" | sort | head -n 1 || true)
          fi

          if [ -z "$APK_PATH" ]; then
            echo "::error::Tidak ada file .apk yang ditemukan. Build kemungkinan gagal atau menghasilkan format lain (mis. .aab)."
            echo "Isi folder build hasil Gradle (untuk debugging):"
            find platforms/android -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null || true
            echo "Daftar direktori di platforms/android (maks depth 6):"
            find platforms/android -maxdepth 6 -type d || true
            exit 1
          fi

          echo "APK ditemukan di: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: triase-wa-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
