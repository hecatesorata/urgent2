      - name: Build APK (debug, sudah bisa langsung diinstall)
        run: |
          cordova build android --verbose 2>&1 | tee build.log
          # Check if build actually succeeded
          if [ ! -d "platforms/android/app/build/outputs/apk" ]; then
            echo "::error::Gradle build output directory not found"
            cat build.log
            exit 1
          fi

      - name: Cari lokasi file APK
        id: find_apk
        run: |
          set -e
          echo "Mencari file .apk di platforms/android ..."
          APK_PATH=$(find platforms/android -type f -name "*.apk" 2>/dev/null | sort | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "::error::Tidak ada file .apk yang ditemukan. Build kemungkinan gagal."
            echo "Searching for build outputs:"
            find platforms/android -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.gradle" \) 2>/dev/null | head -20
            ls -la platforms/android/app/build/outputs/ 2>/dev/null || echo "Build outputs directory missing"
            exit 1
          fi

          echo "APK ditemukan di: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
